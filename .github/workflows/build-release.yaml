name: 'Build and release'

# Checks out jellyfin/jellyfin-ffmpeg at an upstream tag, applies patches/, builds, releases.
# See README.md for what this repo is and why.
#
# Nothing is committed or pushed, which is why GITHUB_TOKEN suffices — App tokens are refused
# on any ref whose tree touches .github/workflows/*.

on:
  schedule:
    - cron: '17 6 * * *'   # daily, offset off the hour
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream tag to build (blank = newest on the tracked line)'
        type: string
        default: ''
      force:
        description: 'Rebuild even if this tag is already released here'
        type: boolean
        default: false
      mode:
        description: 'full = build for real (~2.5h) | dry_run = release path only (~3m) | smoke = whole pipeline minus the compile (~3m)'
        type: choice
        options: [full, dry_run, smoke]
        default: full

concurrency:
  group: build-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  UPSTREAM: jellyfin/jellyfin-ffmpeg
  LINE: v8.
  PIN_NAME: n13.0.19.1
  # Advisory: warns if upstream edits the build-wrapper steps copied into the build jobs below.
  # Regenerate by clearing this and reading the value resolve-upstream.sh prints.
  DRIFT_HASH: b81e6dbb8e9d36f8

jobs:
  resolve:
    name: 'Resolve upstream'
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.r.outputs.proceed }}
      upstream_tag: ${{ steps.r.outputs.upstream_tag }}
      release_tag: ${{ steps.r.outputs.release_tag }}
      pkg_ver: ${{ steps.r.outputs.pkg_ver }}
      mode: ${{ steps.m.outputs.mode }}

    steps:
      - uses: actions/checkout@v7

      # Runs before anything is resolved or published. ~1s. This is what keeps the rename and
      # version-comparison logic from silently rotting.
      - name: Self-test
        run: ./.github/scripts/resolve-upstream.sh --self-test

      # The patch/checks pairing gate is a property of the REPO, not of a binary, so it must fail
      # in the first minute rather than 2.5 hours in — and it must fail in dry_run and smoke too,
      # where the four verify steps are skipped for want of a binary. Also runs the stub-binary
      # end-to-end assertions, so the green path is exercised on every run and not only when a
      # real build happens to produce a good binary.
      #
      # checks.yaml runs this same command on push and pull_request. This copy is the backstop
      # for anything that reaches main without one.
      - name: Verification manifest self-test
        run: ./.github/scripts/verify-binary.sh --self-test

      # Normalise once, so every downstream `if:` compares the same way whether the trigger was
      # schedule (inputs absent) or workflow_dispatch.
      - name: Resolve run mode
        id: m
        run: echo "mode=${{ inputs.mode || 'full' }}" >> "$GITHUB_OUTPUT"

      - name: Resolve
        id: r
        env:
          GH_TOKEN: ${{ github.token }}
          WANT_TAG: ${{ inputs.tag }}
          FORCE: ${{ inputs.force == true && 'true' || 'false' }}
          MODE: ${{ steps.m.outputs.mode }}
        run: ./.github/scripts/resolve-upstream.sh

  # ---------------------------------------------------------------------------------------
  # Build jobs. The wrapper steps mirror upstream's _meta_portable.yaml (L34-60) and
  # _meta_win_clang_portable.yaml (L22-40, L41-69). The build LOGIC is not copied —
  # ./build-linux-amd64, ./build-linux-arm64, ./msys2/build.sh and ./msys2/buildarm64.sh all come
  # from the checked-out upstream tree, so upstream's changes to the build itself arrive for free.
  #
  # 4 of upstream's 18 artifacts: the two portable linux and the two portable windows-clang
  # targets. The arm64 pair costs nothing in wall clock (all four run in parallel; measured
  # 143/107/135/136 min on upstream run 31869623375) and needs no new patches, because the
  # patches attach to a BUILD SYSTEM, not a target — builder/scripts.d covers linux64 and
  # linuxarm64, msys2/PKGBUILD covers win64 and winarm64.
  #
  # Deliberately still excluded: the 12 .deb packages, which are a third build system with its
  # own unpatched header pin, and the 2 mac targets, where 50-ffnvcodec.sh:7 disables ffnvcodec
  # outright so a build from here would be identical to upstream's.
  # ---------------------------------------------------------------------------------------

  build_linux:
    name: 'Build portable linux amd64'
    needs: resolve
    if: needs.resolve.outputs.proceed == 'true' && needs.resolve.outputs.mode != 'dry_run'
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1   # no floating v1 tag exists for this action
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout upstream at the tag
        uses: actions/checkout@v7
        with:
          repository: jellyfin/jellyfin-ffmpeg   # keep in sync with env.UPSTREAM
          ref: ${{ needs.resolve.outputs.upstream_tag }}

      - name: Checkout this recipe
        uses: actions/checkout@v7
        with:
          path: .fork
          fetch-depth: 1

      # The recipe's source patches only CREATE debian/patches/09xx-*.patch; they deliberately do
      # not patch debian/patches/series. Appending a line with a diff hunk anchors it to the tail
      # of that file, and the tail is exactly what upstream changes -- v8.1.2-3 added a patch and
      # broke every build. So the line is generated here instead. Idempotent, and 09* cannot
      # collide with upstream's 00xx numbering.
      #
      # The want/got check is load-bearing: without it a source patch that failed to create its
      # file would make this a silent no-op and the build would succeed WITHOUT the patch. The
      # gate would catch that for 0004, but not for 0003, which is declared ungateable.
      - name: Apply patch series
        run: |
          set -euo pipefail
          git apply --verbose .fork/patches/jellyfin-ffmpeg/*.patch
          want=$(grep -l 'debian/patches/09' .fork/patches/jellyfin-ffmpeg/*.patch | wc -l | tr -d ' ')
          got=0
          for f in debian/patches/09*.patch; do
            [ -e "$f" ] || continue
            b=$(basename "$f")
            got=$((got + 1))
            grep -qxF "$b" debian/patches/series || echo "$b" >> debian/patches/series
          done
          [ "$got" -eq "$want" ] || {
            echo "::error::expected $want recipe patches in debian/patches, found $got"
            exit 1
          }
          echo "  appended $got recipe patches; series is now $(wc -l < debian/patches/series) long"

      - name: Stub artifact (smoke only)
        if: needs.resolve.outputs.mode == 'smoke'
        env:
          VER: ${{ needs.resolve.outputs.pkg_ver }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # Must not be zero bytes: the release asset upload API rejects empty files with
          # "HTTP 400: Bad Content-Length".
          echo "smoke-run stub, not a real build" > "dist/jellyfin-ffmpeg_${VER}_portable_linux64-gpl.tar.xz"

      - name: Build portable
        if: needs.resolve.outputs.mode != 'smoke'
        run: ./build-linux-amd64 ./dist

      # Ask ffmpeg, don't grep the binary. -h reads the encoder's static AVOption table and
      # -filters the compiled-in filter list; neither loads the NVIDIA driver, so this works on
      # a runner with no GPU. This is the only check that actually proves the build did what
      # the fork exists to do — a win64 asset missing every one of these was published because
      # nothing here looked past the plumbing.
      #
      # WHAT it checks is not written here or in the script: each patch declares its own checks
      # in patches/jellyfin-ffmpeg/checks/NNNN.checks. Adding a patch requires adding one, which
      # is why this step never changes when the patch set does.
      - name: Verify the binary carries the features
        if: needs.resolve.outputs.mode == 'full'
        run: |
          set -euo pipefail
          tmp=$(mktemp -d); tar xf dist/*_portable_linux64-gpl.tar.xz -C "$tmp"
          # The 2nd argument is the target. Both linux jobs hand over a path named `ffmpeg`, so
          # arch is not recoverable from it -- without this, a linux64-only declaration such as
          # 0008's would be asserted against the arm64 asset too. verify-binary.sh treats a
          # fine-grained declaration with no target as a hard error, never a skip.
          .fork/.github/scripts/verify-binary.sh "$(find "$tmp" -name ffmpeg -type f | head -1)" linux64

      - uses: actions/upload-artifact@v7
        with:
          name: linux-amd64-portable
          path: dist

  build_linux_arm64:
    name: 'Build portable linux arm64'
    needs: resolve
    if: needs.resolve.outputs.proceed == 'true' && needs.resolve.outputs.mode != 'dry_run'
    # x86-64 on purpose. builder/images/base-linuxarm64/ is a crosstool-NG CROSS toolchain
    # (ct-ng-config, cross.meson, rustup target add aarch64-unknown-linux-gnu) that runs on an
    # x86-64 host — the same way upstream builds it. An arm64 runner would not help.
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1   # no floating v1 tag exists for this action
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout upstream at the tag
        uses: actions/checkout@v7
        with:
          repository: jellyfin/jellyfin-ffmpeg   # keep in sync with env.UPSTREAM
          ref: ${{ needs.resolve.outputs.upstream_tag }}

      - name: Checkout this recipe
        uses: actions/checkout@v7
        with:
          path: .fork
          fetch-depth: 1

      # The recipe's source patches only CREATE debian/patches/09xx-*.patch; they deliberately do
      # not patch debian/patches/series. Appending a line with a diff hunk anchors it to the tail
      # of that file, and the tail is exactly what upstream changes -- v8.1.2-3 added a patch and
      # broke every build. So the line is generated here instead. Idempotent, and 09* cannot
      # collide with upstream's 00xx numbering.
      #
      # The want/got check is load-bearing: without it a source patch that failed to create its
      # file would make this a silent no-op and the build would succeed WITHOUT the patch. The
      # gate would catch that for 0004, but not for 0003, which is declared ungateable.
      - name: Apply patch series
        run: |
          set -euo pipefail
          git apply --verbose .fork/patches/jellyfin-ffmpeg/*.patch
          want=$(grep -l 'debian/patches/09' .fork/patches/jellyfin-ffmpeg/*.patch | wc -l | tr -d ' ')
          got=0
          for f in debian/patches/09*.patch; do
            [ -e "$f" ] || continue
            b=$(basename "$f")
            got=$((got + 1))
            grep -qxF "$b" debian/patches/series || echo "$b" >> debian/patches/series
          done
          [ "$got" -eq "$want" ] || {
            echo "::error::expected $want recipe patches in debian/patches, found $got"
            exit 1
          }
          echo "  appended $got recipe patches; series is now $(wc -l < debian/patches/series) long"

      - name: Stub artifact (smoke only)
        if: needs.resolve.outputs.mode == 'smoke'
        env:
          VER: ${{ needs.resolve.outputs.pkg_ver }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # Must not be zero bytes — see the linux amd64 stub step.
          echo "smoke-run stub, not a real build" > "dist/jellyfin-ffmpeg_${VER}_portable_linuxarm64-gpl.tar.xz"

      - name: Build portable
        if: needs.resolve.outputs.mode != 'smoke'
        run: ./build-linux-arm64 ./dist

      # NO verify step here, and that is not an oversight: this runner is x86-64 and cannot
      # execute the aarch64 binary it just produced. The gate runs in verify_linux_arm64 below,
      # on an arm64 runner, and the release job requires THAT job to succeed — so an unverified
      # binary still never reaches a release. Every other build job verifies in place because
      # every other build job runs on its output's own platform.
      - uses: actions/upload-artifact@v7
        with:
          name: linux-arm64-portable
          path: dist

  build_windows:
    name: 'Build portable win64 (clang)'
    needs: resolve
    if: needs.resolve.outputs.proceed == 'true' && needs.resolve.outputs.mode != 'dry_run'
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: CLANG64
          install: >-
            git
            curl
            wget
            zip
            mingw-w64-clang-x86_64-toolchain
            quilt
            diffstat
            mingw-w64-clang-x86_64-nasm

      - name: Checkout upstream at the tag
        uses: actions/checkout@v7
        with:
          repository: jellyfin/jellyfin-ffmpeg   # keep in sync with env.UPSTREAM
          ref: ${{ needs.resolve.outputs.upstream_tag }}

      - name: Checkout this recipe
        uses: actions/checkout@v7
        with:
          path: .fork
          fetch-depth: 1

      # The recipe's source patches only CREATE debian/patches/09xx-*.patch; they deliberately do
      # not patch debian/patches/series. Appending a line with a diff hunk anchors it to the tail
      # of that file, and the tail is exactly what upstream changes -- v8.1.2-3 added a patch and
      # broke every build. So the line is generated here instead. Idempotent, and 09* cannot
      # collide with upstream's 00xx numbering.
      #
      # The want/got check is load-bearing: without it a source patch that failed to create its
      # file would make this a silent no-op and the build would succeed WITHOUT the patch. The
      # gate would catch that for 0004, but not for 0003, which is declared ungateable.
      - name: Apply patch series
        run: |
          set -euo pipefail
          git apply --verbose .fork/patches/jellyfin-ffmpeg/*.patch
          want=$(grep -l 'debian/patches/09' .fork/patches/jellyfin-ffmpeg/*.patch | wc -l | tr -d ' ')
          got=0
          for f in debian/patches/09*.patch; do
            [ -e "$f" ] || continue
            b=$(basename "$f")
            got=$((got + 1))
            grep -qxF "$b" debian/patches/series || echo "$b" >> debian/patches/series
          done
          [ "$got" -eq "$want" ] || {
            echo "::error::expected $want recipe patches in debian/patches, found $got"
            exit 1
          }
          echo "  appended $got recipe patches; series is now $(wc -l < debian/patches/series) long"

      - name: Prepare prefix dir
        run: mkdir /clang64/ffbuild

      - name: Stub artifact (smoke only)
        if: needs.resolve.outputs.mode == 'smoke'
        env:
          VER: ${{ needs.resolve.outputs.pkg_ver }}
        run: |
          set -euo pipefail
          mkdir -p ./msys2/artifacts
          # Must not be zero bytes — see the linux stub step.
          echo "smoke-run stub, not a real build" > "./msys2/artifacts/jellyfin-ffmpeg_${VER}_portable_win64-clang-gpl.zip"
          # Mimic the real build: msys2/build.sh:127 also writes this pointer file here. The
          # stub must reproduce it, or smoke cannot catch the upload picking up extra files.
          echo "jellyfin-ffmpeg_${VER}_portable_win64-clang-gpl.zip" > "./msys2/artifacts/win64-clang-gpl.txt"

      - name: Build portable
        if: needs.resolve.outputs.mode != 'smoke'
        run: ./msys2/build.sh

      # Same gate as the linux job, run natively on the windows runner. This is the check that
      # would have caught the win64 asset shipping with NVENC but none of the tuning options,
      # because Windows pins the headers in msys2/PKGBUILD, not builder/scripts.d.
      - name: Verify the binary carries the features
        if: needs.resolve.outputs.mode == 'full'
        run: .fork/.github/scripts/verify-binary.sh "$(find . -name ffmpeg.exe -type f | head -1)" win64

      # Only the zip. msys2/build.sh:127 also drops a <target>-<variant>.txt pointer file into
      # this directory for upstream's own publish flow; uploading it would put a third file in
      # dist/ and trip the rename assertion.
      - uses: actions/upload-artifact@v7
        with:
          name: win-clang-win64-portable
          path: ./msys2/artifacts/*.zip

  build_windows_arm64:
    name: 'Build portable winarm64 (clang)'
    needs: resolve
    if: needs.resolve.outputs.proceed == 'true' && needs.resolve.outputs.mode != 'dry_run'
    # Native arm64 windows, so msys2/buildarm64.sh runs unmodified and the verify gate below can
    # execute the arm64 ffmpeg.exe in place. Runner and package names are upstream's own, from
    # _meta_win_clang_portable.yaml:22-40.
    runs-on: windows-11-arm
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: CLANGARM64
          install: >-
            git
            curl
            wget
            zip
            mingw-w64-clang-aarch64-toolchain
            quilt
            diffstat
            mingw-w64-clang-aarch64-nasm

      - name: Checkout upstream at the tag
        uses: actions/checkout@v7
        with:
          repository: jellyfin/jellyfin-ffmpeg   # keep in sync with env.UPSTREAM
          ref: ${{ needs.resolve.outputs.upstream_tag }}

      - name: Checkout this recipe
        uses: actions/checkout@v7
        with:
          path: .fork
          fetch-depth: 1

      # The recipe's source patches only CREATE debian/patches/09xx-*.patch; they deliberately do
      # not patch debian/patches/series. Appending a line with a diff hunk anchors it to the tail
      # of that file, and the tail is exactly what upstream changes -- v8.1.2-3 added a patch and
      # broke every build. So the line is generated here instead. Idempotent, and 09* cannot
      # collide with upstream's 00xx numbering.
      #
      # The want/got check is load-bearing: without it a source patch that failed to create its
      # file would make this a silent no-op and the build would succeed WITHOUT the patch. The
      # gate would catch that for 0004, but not for 0003, which is declared ungateable.
      - name: Apply patch series
        run: |
          set -euo pipefail
          git apply --verbose .fork/patches/jellyfin-ffmpeg/*.patch
          want=$(grep -l 'debian/patches/09' .fork/patches/jellyfin-ffmpeg/*.patch | wc -l | tr -d ' ')
          got=0
          for f in debian/patches/09*.patch; do
            [ -e "$f" ] || continue
            b=$(basename "$f")
            got=$((got + 1))
            grep -qxF "$b" debian/patches/series || echo "$b" >> debian/patches/series
          done
          [ "$got" -eq "$want" ] || {
            echo "::error::expected $want recipe patches in debian/patches, found $got"
            exit 1
          }
          echo "  appended $got recipe patches; series is now $(wc -l < debian/patches/series) long"

      - name: Prepare prefix dir
        run: mkdir /clangarm64/ffbuild

      - name: Stub artifact (smoke only)
        if: needs.resolve.outputs.mode == 'smoke'
        env:
          VER: ${{ needs.resolve.outputs.pkg_ver }}
        run: |
          set -euo pipefail
          mkdir -p ./msys2/artifacts
          # Must not be zero bytes — see the linux amd64 stub step.
          echo "smoke-run stub, not a real build" > "./msys2/artifacts/jellyfin-ffmpeg_${VER}_portable_winarm64-clang-gpl.zip"
          # msys2/buildarm64.sh:126 writes this pointer file alongside the zip, exactly as
          # build.sh:127 does. The stub reproduces it so smoke still catches the upload taking
          # extra files — that is the bug that cost a full 2h23m build on the win64 side.
          echo "jellyfin-ffmpeg_${VER}_portable_winarm64-clang-gpl.zip" > "./msys2/artifacts/winarm64-clang-gpl.txt"

      - name: Build portable
        if: needs.resolve.outputs.mode != 'smoke'
        run: ./msys2/buildarm64.sh

      # Runs on the binary's own platform, same as the win64 job.
      - name: Verify the binary carries the features
        if: needs.resolve.outputs.mode == 'full'
        run: .fork/.github/scripts/verify-binary.sh "$(find . -name ffmpeg.exe -type f | head -1)" winarm64

      # Only the zip — buildarm64.sh:126 drops a winarm64-clang-gpl.txt pointer here too.
      - uses: actions/upload-artifact@v7
        with:
          name: win-clang-winarm64-portable
          path: ./msys2/artifacts/*.zip

  # ---------------------------------------------------------------------------------------
  # The gate that build_linux_arm64 cannot run itself. Downloads that job's artifact onto an
  # arm64 runner and applies the same verify-binary.sh every other build job applies in place.
  # The release job requires this job to succeed, so the protection is equivalent: a featureless
  # arm64 binary exists as a CI artifact but is never published.
  # ---------------------------------------------------------------------------------------

  verify_linux_arm64:
    name: 'Verify portable linux arm64'
    needs: [resolve, build_linux_arm64]
    if: needs.resolve.outputs.proceed == 'true' && needs.resolve.outputs.mode != 'dry_run'
    runs-on: ubuntu-24.04-arm
    steps:
      # Only this repo — the script is all that is needed, not the upstream tree.
      - uses: actions/checkout@v7
        with:
          path: .fork
          fetch-depth: 1

      - uses: actions/download-artifact@v8
        with:
          name: linux-arm64-portable
          path: dist

      # Skipped in smoke, where the artifact is a text stub. The JOB still runs in smoke, which
      # is what proves the ubuntu-24.04-arm label allocates without spending 2.5h to find out.
      - name: Verify the binary carries the features
        if: needs.resolve.outputs.mode == 'full'
        run: |
          set -euo pipefail
          tmp=$(mktemp -d); tar xf dist/*_portable_linuxarm64-gpl.tar.xz -C "$tmp"
          .fork/.github/scripts/verify-binary.sh "$(find "$tmp" -name ffmpeg -type f | head -1)" linuxarm64

  # ---------------------------------------------------------------------------------------

  release:
    name: 'Publish release'
    needs: [resolve, build_linux, build_linux_arm64, build_windows, build_windows_arm64, verify_linux_arm64]
    # always() so dry_run's skipped build jobs do not skip this one too. The explicit success
    # checks keep `needs:` as the real gate otherwise: any failed build means no release, with no
    # artifact-presence probing needed.
    #
    # All four builds are required rather than treating the arm pair as best-effort. They ride
    # the same two build systems as their amd64 counterparts, and in the two runs of upstream's
    # full 18-job matrix that got far enough to tell, all four arm jobs were green — every
    # failure observed there was a .deb job, which this repo does not build. Publishing a partial
    # set would also be sticky: the next day resolves proceed=false, so the missing assets would
    # never be retried without a forced rebuild.
    #
    # verify_linux_arm64 is listed because that job IS build_linux_arm64's gate. Its own `if:`
    # carries no status function, so GitHub adds an implicit success() and the job is 'skipped'
    # (not 'success') whenever that build fails — which keeps this check correct.
    if: >-
      always()
      && needs.resolve.outputs.proceed == 'true'
      && ( needs.resolve.outputs.mode == 'dry_run'
           || ( needs.build_linux.result == 'success'
                && needs.build_linux_arm64.result == 'success'
                && needs.build_windows.result == 'success'
                && needs.build_windows_arm64.result == 'success'
                && needs.verify_linux_arm64.result == 'success' ) )
    runs-on: ubuntu-latest
    steps:
      - name: Download built artifacts
        if: needs.resolve.outputs.mode != 'dry_run'
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # dry_run skips the build jobs entirely, so there is nothing to download — stub the four
      # filenames the builds would have produced. Names come from debian/changelog via
      # builder/build.sh:88 and msys2/build*.sh, which is why pkg_ver is read from there rather
      # than from the tag.
      - name: Stub artifacts (dry_run only)
        if: needs.resolve.outputs.mode == 'dry_run'
        env:
          VER: ${{ needs.resolve.outputs.pkg_ver }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # Must not be zero bytes: the asset upload API rejects empty files with
          # "HTTP 400: Bad Content-Length".
          echo "dry-run stub, not a real build" > "dist/jellyfin-ffmpeg_${VER}_portable_linux64-gpl.tar.xz"
          echo "dry-run stub, not a real build" > "dist/jellyfin-ffmpeg_${VER}_portable_linuxarm64-gpl.tar.xz"
          echo "dry-run stub, not a real build" > "dist/jellyfin-ffmpeg_${VER}_portable_win64-clang-gpl.zip"
          echo "dry-run stub, not a real build" > "dist/jellyfin-ffmpeg_${VER}_portable_winarm64-clang-gpl.zip"

      # Upstream names assets from debian/changelog only, so a fork build is byte-identically
      # named to a stock one — which matters when the file is downloaded by hand. Suffixing the
      # version keeps _portable_<platform>-gpl.<ext> contiguous, so upstream's own glob shape
      # (build-linux-amd64:24) still matches. Asserted in --self-test.
      - name: Mark assets as fork builds
        env:
          VER: ${{ needs.resolve.outputs.pkg_ver }}
        run: |
          set -euo pipefail
          echo "--- as built ---"; ls -l dist
          for f in dist/*; do
            case "$f" in
              *-nvenc-*) echo "::error::already renamed, refusing to double-apply: $f"; exit 1 ;;
            esac
            new="${f/_${VER}_/_${VER}-nvenc-${PIN_NAME}_}"
            # A no-op means upstream changed how it names assets. Assert it explicitly:
            # `mv a a` exits 0, so set -e would let unrenamed assets ship, green and wrong.
            [ "$new" != "$f" ] || {
              echo "::error::rename produced no change for $f (expected _${VER}_ in the name)"
              exit 1
            }
            mv "$f" "$new"
          done
          # Assert identity, not cardinality. A count of 4 passes for four wrong files, or the
          # same file four times — the old count-only check caught the stray .txt by accident,
          # because 3 != 2. Name each one, then count.
          for want in "jellyfin-ffmpeg_${VER}-nvenc-${PIN_NAME}_portable_linux64-gpl.tar.xz" \
                      "jellyfin-ffmpeg_${VER}-nvenc-${PIN_NAME}_portable_linuxarm64-gpl.tar.xz" \
                      "jellyfin-ffmpeg_${VER}-nvenc-${PIN_NAME}_portable_win64-clang-gpl.zip" \
                      "jellyfin-ffmpeg_${VER}-nvenc-${PIN_NAME}_portable_winarm64-clang-gpl.zip"; do
            [ -f "dist/$want" ] || { echo "::error::missing expected asset: $want"; exit 1; }
          done
          n=$(find dist -type f | wc -l)
          [ "$n" -eq 4 ] || { echo "::error::expected exactly those 4 assets, found $n:"; ls -1 dist; exit 1; }
          echo "--- to upload ---"; ls -l dist


      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job, so gh has no git remote to infer the repo from.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.release_tag }}
          UPSTREAM_TAG: ${{ needs.resolve.outputs.upstream_tag }}
          MODE: ${{ needs.resolve.outputs.mode }}
        run: |
          set -euo pipefail
          {
            if [ "$MODE" != "full" ]; then
              echo "**${MODE} run — these assets are empty stubs. Delete this release and its tag.**"
              echo
            fi
            echo "Upstream \`${UPSTREAM_TAG}\` built with nv-codec-headers bumped to \`${PIN_NAME}\`,"
            echo "unlocking \`-tune uhq\`, \`-tf_level\`, \`-lookahead_level\` and \`-split_encode_mode\`."
            echo
            echo "Also carries **CUDA-accelerated VMAF** — the \`libvmaf\` and \`libvmaf_cuda\` filters."
            echo "\`libvmaf_cuda\` is **linux64 only**; the other three assets get neither filter."
            echo
            echo "Driver floors — check yours before installing:"
            echo
            echo "| | floor |"
            echo "|---|---|"
            echo "| NVENC and everything else here | **570.0** |"
            echo "| \`libvmaf_cuda\` (linux64) | **580**, and a **Turing or newer** GPU |"
            echo
            echo "\`libvmaf_cuda\` takes CUDA frames only. 8, 10, 12 and 16 bit are all accepted, so"
            echo "10-bit HDR and Dolby Vision go in natively:"
            echo '```'
            echo "ffmpeg -init_hw_device cuda=cu -filter_hw_device cu -i dis.mkv -i ref.mkv \\"
            echo "  -lavfi \"[0:v]format=yuv420p10le,hwupload_cuda[d]; \\"
            echo "          [1:v]format=yuv420p10le,hwupload_cuda[r]; \\"
            echo "          [d][r]libvmaf_cuda=log_fmt=json:log_path=out.json\" -f null -"
            echo '```'
            echo
            echo "From a CUDA decode the format is \`p010le\` — convert with"
            echo "\`scale_cuda=format=yuv420p10\` first. **Never feed \`p010\` straight in:** its luma is"
            echo "MSB-aligned, so it is read 64x too bright and scores wrong without erroring. Likewise"
            echo "\`scale_cuda=format=yuv420p\` on 10-bit input silently measures the 8-bit projection."
            echo
            echo "Scores match the CPU \`libvmaf\` filter to ~0.0001 VMAF at both 8 and 10 bit."
            echo
            echo "Built by checking out \`${UPSTREAM}\` at \`${UPSTREAM_TAG}\` and applying"
            echo "\`patches/jellyfin-ffmpeg/\`. Reproduce with:"
            echo '```'
            echo "git clone -b ${UPSTREAM_TAG} https://github.com/${UPSTREAM}.git && cd jellyfin-ffmpeg"
            echo "git apply /path/to/patches/jellyfin-ffmpeg/*.patch"
            echo "./build-linux-amd64 ./dist    # linux64    (needs docker)"
            echo "./build-linux-arm64 ./dist    # linuxarm64 (needs docker; cross-compiled on x86-64)"
            echo "./msys2/build.sh              # win64      (needs msys2 CLANG64)"
            echo "./msys2/buildarm64.sh         # winarm64   (needs msys2 CLANGARM64 on arm64 windows)"
            echo '```'
            echo
            echo "Assets carry \`-nvenc-${PIN_NAME}\` in the filename to distinguish them from"
            echo "upstream's identically-versioned builds."
          } > notes.md

          # `gh release create` defaults --latest to "automatic based on date and version", so a
          # smoke/dry_run release created after a real one could become Latest — and anything
          # resolving /releases/latest would then fetch a stub. Be explicit in both directions.
          if [ "$MODE" = "full" ]; then
            LATEST=(--latest)
          else
            LATEST=(--prerelease --latest=false)
          fi

          # Never delete an existing REAL release to republish it. delete->create is not
          # atomic, so a create failure after the delete would destroy a good release that
          # deployments depend on. Test releases are disposable, so they keep the simple path.
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$MODE" = "full" ]; then
              echo "Release $TAG exists — updating in place, not recreating."
              gh release edit "$TAG" "${LATEST[@]}" \
                --title "${UPSTREAM_TAG} (nv-codec-headers ${PIN_NAME})" \
                --notes-file notes.md
              # --clobber replaces assets of the same name; the release is never absent.
              gh release upload "$TAG" dist/* --clobber
              echo "Updated $TAG with $(find dist -type f | wc -l) assets"
              exit 0
            fi
            gh release delete --cleanup-tag --yes "$TAG"
          fi
          # Creates the tag at --target if it does not exist. Internally this creates a draft,
          # uploads the assets, then publishes — so a failed upload leaves nothing behind.
          gh release create "$TAG" \
            "${LATEST[@]}" \
            --target "${{ github.sha }}" \
            --title "${UPSTREAM_TAG} (nv-codec-headers ${PIN_NAME})" \
            --notes-file notes.md \
            dist/*
          echo "Published $TAG with $(find dist -type f | wc -l) assets"
          if [ "$MODE" != "full" ]; then
            echo "::warning::$MODE release — delete it and its tag when you are done inspecting it"
          fi
