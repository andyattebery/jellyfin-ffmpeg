name: 'Build and release'

# Checks out jellyfin/jellyfin-ffmpeg at an upstream tag, applies patches/, builds, releases.
# See README.md for what this repo is and why.
#
# Nothing is committed or pushed, which is why GITHUB_TOKEN suffices — App tokens are refused
# on any ref whose tree touches .github/workflows/*.

on:
  schedule:
    - cron: '17 6 * * *'   # daily, offset off the hour
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream tag to build (blank = newest on the tracked line)'
        type: string
        default: ''
      force:
        description: 'Rebuild even if this tag is already released here'
        type: boolean
        default: false
      mode:
        description: 'full = build for real | dry_run = release path only (~3m) | smoke = whole pipeline minus the compile (~6m)'
        type: choice
        options: [full, dry_run, smoke]
        default: full

concurrency:
  group: build-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  UPSTREAM: jellyfin/jellyfin-ffmpeg
  LINE: v8.
  PIN_NAME: n13.0.19.1
  # Advisory: warns if upstream edits the build-wrapper steps copied into the build jobs below.
  # Regenerate by clearing this and reading the value resolve-upstream.sh prints.
  DRIFT_HASH: b81e6dbb8e9d36f8

jobs:
  resolve:
    name: 'Resolve upstream'
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.r.outputs.proceed }}
      upstream_tag: ${{ steps.r.outputs.upstream_tag }}
      release_tag: ${{ steps.r.outputs.release_tag }}
      pkg_ver: ${{ steps.r.outputs.pkg_ver }}
      mode: ${{ steps.m.outputs.mode }}

    steps:
      - uses: actions/checkout@v7

      # Runs before anything is resolved or published. ~1s. This is what keeps the rename and
      # version-comparison logic from silently rotting.
      - name: Self-test
        run: ./.github/scripts/resolve-upstream.sh --self-test

      # Normalise once, so every downstream `if:` compares the same way whether the trigger was
      # schedule (inputs absent) or workflow_dispatch.
      - name: Resolve run mode
        id: m
        run: echo "mode=${{ inputs.mode || 'full' }}" >> "$GITHUB_OUTPUT"

      - name: Resolve
        id: r
        env:
          GH_TOKEN: ${{ github.token }}
          WANT_TAG: ${{ inputs.tag }}
          FORCE: ${{ inputs.force == true && 'true' || 'false' }}
          MODE: ${{ steps.m.outputs.mode }}
        run: ./.github/scripts/resolve-upstream.sh

  # ---------------------------------------------------------------------------------------
  # Build jobs. The 4 wrapper steps mirror upstream's _meta_portable.yaml (L34-60) and
  # _meta_win_clang_portable.yaml (L41-69). The build LOGIC is not copied — ./build-linux-amd64
  # and ./msys2/build.sh come from the checked-out upstream tree, so upstream's changes to the
  # build itself arrive for free. Only amd64 linux and win64 are built: those are what the fleet
  # installs, and 2 jobs keep a red run meaningful instead of routine.
  # ---------------------------------------------------------------------------------------

  build_linux:
    name: 'Build portable linux amd64'
    needs: resolve
    if: needs.resolve.outputs.proceed == 'true' && needs.resolve.outputs.mode != 'dry_run'
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1   # no floating v1 tag exists for this action
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout upstream at the tag
        uses: actions/checkout@v7
        with:
          repository: jellyfin/jellyfin-ffmpeg   # keep in sync with env.UPSTREAM
          ref: ${{ needs.resolve.outputs.upstream_tag }}

      - name: Checkout this recipe
        uses: actions/checkout@v7
        with:
          path: .fork
          fetch-depth: 1

      - name: Apply patch series
        run: git apply --verbose .fork/patches/jellyfin-ffmpeg/*.patch

      - name: Stub artifact (smoke only)
        if: needs.resolve.outputs.mode == 'smoke'
        env:
          VER: ${{ needs.resolve.outputs.pkg_ver }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # Must not be zero bytes: the release asset upload API rejects empty files with
          # "HTTP 400: Bad Content-Length".
          echo "smoke-run stub, not a real build" > "dist/jellyfin-ffmpeg_${VER}_portable_linux64-gpl.tar.xz"

      - name: Build portable
        if: needs.resolve.outputs.mode != 'smoke'
        run: ./build-linux-amd64 ./dist

      # Ask ffmpeg, don't grep the binary. -h reads the encoder's static AVOption table and
      # -filters the compiled-in filter list; neither loads the NVIDIA driver, so this works on
      # a runner with no GPU. This is the only check that actually proves the build did what
      # the fork exists to do — a win64 asset missing every one of these was published because
      # nothing here looked past the plumbing.
      - name: Verify the binary carries the features
        if: needs.resolve.outputs.mode == 'full'
        run: |
          set -euo pipefail
          tmp=$(mktemp -d); tar xf dist/*_portable_linux64-gpl.tar.xz -C "$tmp"
          .fork/.github/scripts/verify-binary.sh "$(find "$tmp" -name ffmpeg -type f | head -1)"

      - uses: actions/upload-artifact@v7
        with:
          name: linux-amd64-portable
          path: dist

  build_windows:
    name: 'Build portable win64 (clang)'
    needs: resolve
    if: needs.resolve.outputs.proceed == 'true' && needs.resolve.outputs.mode != 'dry_run'
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: CLANG64
          install: >-
            git
            curl
            wget
            zip
            mingw-w64-clang-x86_64-toolchain
            quilt
            diffstat
            mingw-w64-clang-x86_64-nasm

      - name: Checkout upstream at the tag
        uses: actions/checkout@v7
        with:
          repository: jellyfin/jellyfin-ffmpeg   # keep in sync with env.UPSTREAM
          ref: ${{ needs.resolve.outputs.upstream_tag }}

      - name: Checkout this recipe
        uses: actions/checkout@v7
        with:
          path: .fork
          fetch-depth: 1

      - name: Apply patch series
        run: git apply --verbose .fork/patches/jellyfin-ffmpeg/*.patch

      - name: Prepare prefix dir
        run: mkdir /clang64/ffbuild

      - name: Stub artifact (smoke only)
        if: needs.resolve.outputs.mode == 'smoke'
        env:
          VER: ${{ needs.resolve.outputs.pkg_ver }}
        run: |
          set -euo pipefail
          mkdir -p ./msys2/artifacts
          # Must not be zero bytes — see the linux stub step.
          echo "smoke-run stub, not a real build" > "./msys2/artifacts/jellyfin-ffmpeg_${VER}_portable_win64-clang-gpl.zip"
          # Mimic the real build: msys2/build.sh:127 also writes this pointer file here. The
          # stub must reproduce it, or smoke cannot catch the upload picking up extra files.
          echo "jellyfin-ffmpeg_${VER}_portable_win64-clang-gpl.zip" > "./msys2/artifacts/win64-clang-gpl.txt"

      - name: Build portable
        if: needs.resolve.outputs.mode != 'smoke'
        run: ./msys2/build.sh

      # Same gate as the linux job, run natively on the windows runner. This is the check that
      # would have caught the win64 asset shipping with NVENC but none of the tuning options,
      # because Windows pins the headers in msys2/PKGBUILD, not builder/scripts.d.
      - name: Verify the binary carries the features
        if: needs.resolve.outputs.mode == 'full'
        run: .fork/.github/scripts/verify-binary.sh "$(find . -name ffmpeg.exe -type f | head -1)"

      # Only the zip. msys2/build.sh:127 also drops a <target>-<variant>.txt pointer file into
      # this directory for upstream's own publish flow; uploading it would put a third file in
      # dist/ and trip the rename assertion.
      - uses: actions/upload-artifact@v7
        with:
          name: win-clang-win64-portable
          path: ./msys2/artifacts/*.zip

  # ---------------------------------------------------------------------------------------

  release:
    name: 'Publish release'
    needs: [resolve, build_linux, build_windows]
    # always() so dry_run's skipped build jobs do not skip this one too. The two explicit
    # success checks keep `needs:` as the real gate otherwise: a failed build means no release,
    # with no artifact-presence probing needed.
    if: >-
      always()
      && needs.resolve.outputs.proceed == 'true'
      && ( needs.resolve.outputs.mode == 'dry_run'
           || ( needs.build_linux.result == 'success'
                && needs.build_windows.result == 'success' ) )
    runs-on: ubuntu-latest
    steps:
      - name: Download built artifacts
        if: needs.resolve.outputs.mode != 'dry_run'
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # dry_run skips the build jobs entirely, so there is nothing to download — stub the two
      # filenames the builds would have produced. Names come from debian/changelog via
      # builder/build.sh:88, which is why pkg_ver is read from there rather than from the tag.
      - name: Stub artifacts (dry_run only)
        if: needs.resolve.outputs.mode == 'dry_run'
        env:
          VER: ${{ needs.resolve.outputs.pkg_ver }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # Must not be zero bytes: the asset upload API rejects empty files with
          # "HTTP 400: Bad Content-Length".
          echo "dry-run stub, not a real build" > "dist/jellyfin-ffmpeg_${VER}_portable_linux64-gpl.tar.xz"
          echo "dry-run stub, not a real build" > "dist/jellyfin-ffmpeg_${VER}_portable_win64-clang-gpl.zip"

      # Upstream names assets from debian/changelog only, so a fork build is byte-identically
      # named to a stock one — which matters when the file is downloaded by hand. Suffixing the
      # version keeps _portable_<platform>-gpl.<ext> contiguous, so upstream's own glob shape
      # (build-linux-amd64:24) still matches. Asserted in --self-test.
      - name: Mark assets as fork builds
        env:
          VER: ${{ needs.resolve.outputs.pkg_ver }}
        run: |
          set -euo pipefail
          echo "--- as built ---"; ls -l dist
          for f in dist/*; do
            case "$f" in
              *-nvenc-*) echo "::error::already renamed, refusing to double-apply: $f"; exit 1 ;;
            esac
            new="${f/_${VER}_/_${VER}-nvenc-${PIN_NAME}_}"
            # A no-op means upstream changed how it names assets. Assert it explicitly:
            # `mv a a` exits 0, so set -e would let unrenamed assets ship, green and wrong.
            [ "$new" != "$f" ] || {
              echo "::error::rename produced no change for $f (expected _${VER}_ in the name)"
              exit 1
            }
            mv "$f" "$new"
          done
          # Assert identity, not cardinality. A count of 2 passes for two wrong files, or the
          # same file twice — it only caught the stray .txt by accident, because 3 != 2.
          for want in "jellyfin-ffmpeg_${VER}-nvenc-${PIN_NAME}_portable_linux64-gpl.tar.xz" \
                      "jellyfin-ffmpeg_${VER}-nvenc-${PIN_NAME}_portable_win64-clang-gpl.zip"; do
            [ -f "dist/$want" ] || { echo "::error::missing expected asset: $want"; exit 1; }
          done
          n=$(find dist -type f | wc -l)
          [ "$n" -eq 2 ] || { echo "::error::expected exactly those 2 assets, found $n:"; ls -1 dist; exit 1; }
          echo "--- to upload ---"; ls -l dist


      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job, so gh has no git remote to infer the repo from.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.release_tag }}
          UPSTREAM_TAG: ${{ needs.resolve.outputs.upstream_tag }}
          MODE: ${{ needs.resolve.outputs.mode }}
        run: |
          set -euo pipefail
          {
            if [ "$MODE" != "full" ]; then
              echo "**${MODE} run — these assets are empty stubs. Delete this release and its tag.**"
              echo
            fi
            echo "Upstream \`${UPSTREAM_TAG}\` built with nv-codec-headers bumped to \`${PIN_NAME}\`,"
            echo "unlocking \`-tune uhq\`, \`-tf_level\`, \`-lookahead_level\` and \`-split_encode_mode\`."
            echo
            echo "Driver floor is **570.0** — check your driver before installing."
            echo
            echo "Built by checking out \`${UPSTREAM}\` at \`${UPSTREAM_TAG}\` and applying"
            echo "\`patches/jellyfin-ffmpeg/\`. Reproduce with:"
            echo '```'
            echo "git clone -b ${UPSTREAM_TAG} https://github.com/${UPSTREAM}.git && cd jellyfin-ffmpeg"
            echo "git apply /path/to/patches/jellyfin-ffmpeg/*.patch && ./build-linux-amd64 ./dist"
            echo '```'
            echo
            echo "Assets carry \`-nvenc-${PIN_NAME}\` in the filename to distinguish them from"
            echo "upstream's identically-versioned builds."
          } > notes.md

          # `gh release create` defaults --latest to "automatic based on date and version", so a
          # smoke/dry_run release created after a real one could become Latest — and anything
          # resolving /releases/latest would then fetch a stub. Be explicit in both directions.
          if [ "$MODE" = "full" ]; then
            LATEST=(--latest)
          else
            LATEST=(--prerelease --latest=false)
          fi

          # Never delete an existing REAL release to republish it. delete->create is not
          # atomic, so a create failure after the delete would destroy a good release that
          # deployments depend on. Test releases are disposable, so they keep the simple path.
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$MODE" = "full" ]; then
              echo "Release $TAG exists — updating in place, not recreating."
              gh release edit "$TAG" "${LATEST[@]}" \
                --title "${UPSTREAM_TAG} (nv-codec-headers ${PIN_NAME})" \
                --notes-file notes.md
              # --clobber replaces assets of the same name; the release is never absent.
              gh release upload "$TAG" dist/* --clobber
              echo "Updated $TAG with $(find dist -type f | wc -l) assets"
              exit 0
            fi
            gh release delete --cleanup-tag --yes "$TAG"
          fi
          # Creates the tag at --target if it does not exist. Internally this creates a draft,
          # uploads the assets, then publishes — so a failed upload leaves nothing behind.
          gh release create "$TAG" \
            "${LATEST[@]}" \
            --target "${{ github.sha }}" \
            --title "${UPSTREAM_TAG} (nv-codec-headers ${PIN_NAME})" \
            --notes-file notes.md \
            dist/*
          echo "Published $TAG with $(find dist -type f | wc -l) assets"
          if [ "$MODE" != "full" ]; then
            echo "::warning::$MODE release — delete it and its tag when you are done inspecting it"
          fi
