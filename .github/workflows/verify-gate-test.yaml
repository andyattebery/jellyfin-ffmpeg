name: 'Test the verification gate'

# TEMPORARY. Proves .github/scripts/verify-binary.sh behaves correctly on real runners, without
# waiting for a 2.5h build — it runs against already-published release assets.
#
# It is a two-sided test, which is the point. Right now the release carries:
#   linux64   built with n13.0.19.1 -> has the options  -> the script must PASS
#   win64     built with n12.0.16.1 -> lacks them       -> the script must FAIL
#
# So a run of this workflow is only meaningful if linux is green and windows is red. Both green
# would mean the script cannot detect the very bug it was written for.
#
# Delete this workflow once the gate is in the build jobs and a full build has gone green.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to pull assets from'
        type: string
        default: 'v8.1.2-2+nvenc-n13.0.19.1'

permissions:
  contents: read

jobs:
  linux:
    name: 'linux asset — EXPECTED TO PASS'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch and unpack the linux asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "${{ inputs.tag }}" --repo "${{ github.repository }}" \
            --pattern '*_portable_linux64-gpl.tar.xz' --dir .
          mkdir -p bin && tar xf ./*_portable_linux64-gpl.tar.xz -C bin
          find bin -name ffmpeg -type f | head -1 > /tmp/ffpath
          echo "found: $(cat /tmp/ffpath)"

      - name: Run the gate
        run: ./.github/scripts/verify-binary.sh "$(cat /tmp/ffpath)"

  windows:
    name: 'windows asset — EXPECTED TO FAIL until patch 0002 is built'
    runs-on: windows-latest
    # Git Bash, not msys2: the script is plain bash and running a native .exe needs no msys2
    # environment, so the job skips a ~2min toolchain install it has no use for.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Fetch and unpack the windows asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "${{ inputs.tag }}" --repo "${{ github.repository }}" \
            --pattern '*_portable_win64-clang-gpl.zip' --dir .
          7z x -obin ./*_portable_win64-clang-gpl.zip

      - name: Run the gate — a FAILURE here is the expected result today
        continue-on-error: true
        id: gate
        run: ./.github/scripts/verify-binary.sh "$(find bin -name ffmpeg.exe -type f | head -1)"

      - name: Report
        run: |
          if [ "${{ steps.gate.outcome }}" = "failure" ]; then
            echo "EXPECTED: the gate rejected the win64 asset, which is built from n12.0.16.1."
            echo "This is the bug patch 0002 fixes, and proves the gate detects it."
          else
            echo "::error::the gate PASSED the win64 asset — it cannot detect the bug it exists for"
            exit 1
          fi
